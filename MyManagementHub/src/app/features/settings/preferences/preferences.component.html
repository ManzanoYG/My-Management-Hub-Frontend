<h6>PREFERENCES</h6>
<hr>
<form>
    <div class="form-group">
        <label for="theme">Theme</label>
        <select name="theme" id="theme" class="form-select">
            @for (theme of themes; track theme) {
                <option [value]="theme" [selected]="theme === actualTheme">{{ theme }}</option>
            }
        </select>
    </div>
    <div class="form-group">
        <label for="sidebar">Sidebar</label>
        <input type="text" class="form-control" id="sidebar" aria-describedby="sidebarHelp" placeholder="Enter your sidebar preference" value="">
    </div>
    <div class="form-group">
        <label for="appOrder">App Order</label>
        <input type="text" class="form-control" id="appOrder" aria-describedby="appOrderHelp" placeholder="Enter your app order" value="">
    </div>
    <div class="form-group">
        <label for="appDisplay">App Display</label>
        <input type="text" class="form-control" id="appDisplay" aria-describedby="appDisplayHelp" placeholder="Enter your app display preference" value="">
    </div>
    <div class="d-flex justify-content-center">
        <a type="button" class="btn btn-primary" (click)="validatePreferences()"><i class="fa-regular fa-circle-check"></i> Validate</a>
    </div>
</form>
