<h6>YOUR PROFILE INFORMATION</h6>
<hr>
<form>
    <div class="form-group">
        <label for="username">Username</label>
        <input type="text" class="form-control" id="username" aria-describedby="usernameHelp" placeholder="Enter your username" value="">
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" class="form-control" id="email" aria-describedby="emailHelp" placeholder="Enter your email" value="">
    </div>
    <div class="form-group">
        <label for="timezone">Timezone</label>
        <input type="text" class="form-control" id="timezone" placeholder="Enter your timezone" value="">
    </div>
    <div class="form-group">
        <label for="language">Language</label>
        <input type="text" class="form-control" id="language" placeholder="Enter your language" value="">
    </div>
    <div class="form-group small text-muted">
        All of the fields on this page are optional and can be deleted at any time, and by filling them out, you're giving us consent to share this data wherever your user profile appears.
    </div>
    <div class="d-flex justify-content-center mt-2">
        <app-shared-button label="Update Profile" type="button"></app-shared-button>
    </div>
</form>
