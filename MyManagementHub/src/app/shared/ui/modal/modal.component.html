<div class="modal fade" [id]="modalId" tabindex="-1" [attr.aria-labelledby]="modalId + '-label'" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" [id]="modalId + '-label'"><i class="{{ icon }}"></i> {{ title }}</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        {{ body }}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{{ cancelButtonLabel }}</button>
        <button type="button" class="btn btn-primary {{confirmButtonClass}}" (click)="onPress($event)" data-bs-dismiss="modal">{{ confirmButtonLabel }}</button>
      </div>
    </div>
  </div>
</div>
