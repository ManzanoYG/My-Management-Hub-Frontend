<div class="modal fade" [id]="modalId" tabindex="-1" [attr.aria-labelledby]="modalId + '-label'" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" [id]="modalId + '-label'"><i class="{{ icon }}"></i> {{ title }}</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        {{ body }}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" (click)="onPress($event)" data-bs-dismiss="modal">Save changes</button>
      </div>
    </div>
  </div>
</div>
